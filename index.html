<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Controller Input</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
    #log { white-space: pre; font-family: monospace; }
    #connectForm { margin-bottom: 1em; }
  </style>
</head>
<body>
  <h1 style="display: flex; align-items: center; justify-content: center; margin: 0 auto; max-width: 600px; text-align: center;">🎮 Controller Input</h1>
  <form id="connectForm">
    <div style="display: flex; flex-direction: column; gap: 1em;">
      <label style="font-size: 1.2em;">
      IP: <input id="ip" type="text" value="" style="font-size: 1.2em; width: 100%;">
      </label>
      <label style="font-size: 1.2em;">
      Bridge port: <input id="port" type="text" value="" style="font-size: 1.2em; width: 100%;">
      </label>
      <label style="font-size: 1.2em;">
      Manette n°: 
      <select id="controller" style="font-size: 1.2em; width: 100%;">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
      </label>
    </div></label>
  </form>
  <button type="submit" style="width: 100%; height: 100px">Connect</button>
  <div id="log" style="display: flex; align-items: center; justify-content: center; margin: 0 auto; max-width: 600px; text-align: center;">
    Waiting for input...
  </div>

  <script>
let ws = null;
const log = document.getElementById('log');
const form = document.getElementById('connectForm');
const ipInput = document.getElementById('ip');
const portInput = document.getElementById('port');
const controllerInput = document.getElementById('controller');

let prevButtons = [];
let prevAxes = [];

form.addEventListener('submit', function(e) {
  e.preventDefault();
  if (ws && ws.readyState === 1) ws.close();
  const ip = ipInput.value;
  const port = portInput.value;
  ws = new WebSocket(`ws://${ip}:${port}`);
  ws.onopen = () => log.textContent = "WebSocket connected. Waiting for controller...";
  ws.onerror = (e) => log.textContent = "WebSocket error: " + (e.message || e);
  ws.onclose = () => log.textContent = "WebSocket closed.";
});

window.addEventListener("gamepadconnected", (e) => {
  log.textContent = `Controller connected: ${e.gamepad.id}`;
  updateLoop();
});

window.addEventListener("gamepaddisconnected", (e) => {
  log.textContent = `Controller disconnected: ${e.gamepad.id}`;
});

function updateLoop() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  if (gamepads[0]) {
    const gp = gamepads[0];
    let output = `Controller: ${gp.id}\n\nButtons:\n`;
    let data = {};
    let changed = false;

    // Buttons
    gp.buttons.forEach((b, i) => {
      output += `Button ${i}: ${b.pressed ? "Pressed" : "Released"}\n`;
      data[`button_${i}`] = b.pressed ? 1 : 0;
      if (prevButtons[i] !== (b.pressed ? 1 : 0)) changed = true;
    });

    // Axes
    output += "\nAxes:\n";
    gp.axes.forEach((a, i) => {
      const val = Number(a.toFixed(2));
      output += `Axis ${i}: ${val}\n`;
      data[`axis_${i}`] = val;
      if (prevAxes[i] !== val) changed = true;
    });

    // Controller ID (optional, default to 1)
    data["controller"] = parseInt(controllerInput.value) || 1;

    log.textContent = output;

    if (changed && ws && ws.readyState === 1) {
      ws.send(JSON.stringify(data));
      prevButtons = gp.buttons.map(b => b.pressed ? 1 : 0);
      prevAxes = gp.axes.map(a => Number(a.toFixed(2)));
    }
  }
  requestAnimationFrame(updateLoop);
}

let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        console.log('Screen Wake Lock released');
      });
      console.log('Screen Wake Lock acquired');
    }
  } catch (err) {
    console.error(`${err.name}, ${err.message}`);
  }
}

// Request wake lock on page load
requestWakeLock();

// Optional: Re-acquire wake lock if page becomes visible again
document.addEventListener('visibilitychange', () => {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});
  </script>
</body>
</html>
